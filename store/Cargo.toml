[package]
name = "mwc_store"
version = "7.1.0"
authors = ["Mwc Developers <info@mwc.mw>"]
description = "Simple, private and scalable cryptocurrency implementation based on the MimbleWimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mwcproject/mwc-node"
keywords = [ "crypto", "mwc", "mimblewimble" ]
workspace = ".."
edition = "2024"

[dependencies]
mwc_crates = { path = "../mwc_crates", version = "7.1.0", default-features = false }
mwc_core = { path = "../core", version = "7.1.0" }
mwc_util = { path = "../util", version = "7.1.0" }
thiserror.workspace = true

[features]
# Exercise the iOS positional PMMR backend in native regression tests.
test-ios-storage = []
